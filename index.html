<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SNJ Mining Bot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --gold:#ffd447;
  --gold2:#f2b91f;
  --navy:#061226;
  --navy2:#0a1930;
  --line:#c89b27;
  --white:#fff;
  --muted:#aeb9ca;
}

body{
  min-height:100vh;
  background:#061226;
  color:white;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

/* APP */
.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  position:relative;
  padding-bottom:95px;
}

/* HEADER */
.header{
  height:100px;
  padding:18px 18px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #80651e;
  background:rgba(3,12,27,.95);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:58px;
  height:58px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,#fff4a3,#ffd447 38%,#c88608 75%,#5b3600);
  border:3px solid #ffd85a;
  box-shadow:0 0 18px rgba(255,208,50,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#080808;
  font-weight:900;
  font-size:20px;
  position:relative;
}

.logo:after{
  content:"♛";
  position:absolute;
  top:-3px;
  font-size:16px;
  color:#111;
}

.brandText h1{
  font-size:25px;
}

.brandText h1 span{
  color:var(--gold);
}

.brandText p{
  color:#e8c95b;
  font-size:13px;
  margin-top:4px;
}

.headerBtns{
  display:flex;
  gap:8px;
}

.iconBtn{
  width:43px;
  height:43px;
  border-radius:50%;
  border:1px solid #b88d25;
  background:#0a1930;
  color:var(--gold);
  font-size:20px;
}

/* BALANCE */
.balanceCard{
  margin:18px 16px;
  padding:20px;
  border:1px solid var(--line);
  border-radius:28px;
  background:linear-gradient(145deg,#09182d,#071123);
  box-shadow:0 0 25px rgba(218,166,36,.08);
}

.balanceTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.balanceTitle{
  display:flex;
  align-items:center;
  gap:14px;
}

.walletIcon{
  font-size:40px;
}

.balanceTitle h2{
  font-size:22px;
}

.balanceTitle p{
  color:var(--muted);
  margin-top:5px;
}

.total{
  display:flex;
  align-items:center;
  gap:8px;
}

.miniCoin{
  width:48px;
  height:48px;
  border-radius:50%;
  background:radial-gradient(circle,#ffe986,#ffd13b 55%,#a96900);
  border:2px solid #ffe37b;
  color:#111;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
}

.total strong{
  color:var(--gold);
  font-size:29px;
}

.total small{
  color:var(--gold);
  font-size:14px;
}

.balanceStats{
  margin-top:20px;
  padding-top:16px;
  border-top:1px solid #5f5b45;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
}

.stat{
  text-align:center;
  border-right:1px solid #364154;
}

.stat:last-child{
  border:0;
}

.stat p{
  color:#aeb9ca;
  font-size:14px;
  margin-bottom:8px;
}

.stat strong{
  color:var(--gold);
  font-size:20px;
}

/* N TOKEN */
.nCard{
  margin:0 16px 22px;
  padding:18px;
  border:1px solid #527ba9;
  border-radius:25px;
  background:linear-gradient(145deg,#0a2341,#08172d);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.nLeft{
  display:flex;
  align-items:center;
  gap:14px;
}

.nLogo{
  width:65px;
  height:65px;
  border-radius:50%;
  border:5px double #e2ae58;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#f2d7a5;
  font-size:38px;
  font-weight:bold;
  box-shadow:0 0 15px rgba(226,174,88,.2);
}

.nText h2{
  font-size:20px;
}

.nText p{
  color:#9caabd;
  margin-top:5px;
}

.nAmount{
  color:#ffd789;
  font-size:25px;
  font-weight:bold;
}

.nAmount small{
  font-size:14px;
}

/* MINING */
.mining{
  margin:0 16px;
  text-align:center;
}

.bigCoin{
  width:235px;
  height:235px;
  margin:20px auto 22px;
  border-radius:50%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,
      #fff080 0%,
      #ffd849 38%,
      #d99c16 62%,
      #754500 78%,
      #dba92d 100%);
  border:12px solid #b8790b;
  box-shadow:
    0 0 20px rgba(255,210,50,.6),
    inset 0 0 0 7px #ffe783,
    inset 0 0 0 18px #d18c0c;
  transition:.25s;
}

.bigCoin:before{
  content:"";
  position:absolute;
  inset:28px;
  border:4px solid rgba(255,245,170,.85);
  border-radius:50%;
}

.bigCoin span{
  position:relative;
  z-index:2;
  color:#080808;
  font-size:88px;
  font-weight:900;
}

.bigCoin.glow{
  transform:scale(1.035);
  box-shadow:
    0 0 35px #ffd83d,
    0 0 70px rgba(255,210,50,.35),
    inset 0 0 0 7px #fff4a0;
}

.miningTitle{
  color:var(--gold);
  font-size:30px;
  font-weight:bold;
  letter-spacing:2px;
  margin-bottom:18px;
}

.timer{
  border:3px solid #d4a72b;
  border-radius:50px;
  padding:15px 10px;
  background:#071326;
  font-size:42px;
  font-weight:900;
  letter-spacing:1px;
}

.rate{
  color:#aeb9ca;
  font-size:17px;
  margin:20px 0;
}

.rate b{
  color:#fff;
}

/* CLAIM */
.claim{
  width:100%;
  border:0;
  border-radius:50px;
  padding:19px;
  background:linear-gradient(90deg,#e8ae20,#ffe45d,#e8ae20);
  color:#080808;
  font-size:23px;
  font-weight:900;
  box-shadow:0 0 20px rgba(255,210,50,.3);
  position:relative;
  overflow:hidden;
}

.claim:active{
  transform:scale(.97);
}

.claim.shine:after{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:60%;
  height:100%;
  background:rgba(255,255,255,.5);
  transform:skewX(-20deg);
  animation:shine .5s;
}

@keyframes shine{
  to{left:150%}
}

/* AD */
.ad{
  margin-top:15px;
  width:100%;
  border:1px solid #38699b;
  border-radius:25px;
  padding:17px;
  background:#0a1d39;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.ad span{
  float:right;
  background:#ffd447;
  color:#111;
  padding:8px 14px;
  border-radius:12px;
}

/* BOTTOM NAV */
.nav{
  position:fixed;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  width:calc(100% - 20px);
  max-width:500px;
  padding:10px 4px;
  border:1px solid #b88d25;
  border-radius:24px;
  background:rgba(5,17,34,.97);
  display:grid;
  grid-template-columns:repeat(6,1fr);
  z-index:50;
}

.nav button{
  border:0;
  background:transparent;
  color:#aeb9ca;
  font-size:11px;
  padding:6px 2px;
}

.nav button div{
  font-size:25px;
  margin-bottom:3px;
}

.nav button.active{
  color:var(--gold);
}

/* FLYING COINS */
.flyCoin{
  position:fixed;
  width:34px;
  height:34px;
  border-radius:50%;
  background:radial-gradient(circle,#fff18b,#ffc928,#9a6000);
  border:3px solid #ffe88b;
  color:#111;
  font-size:9px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  pointer-events:none;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.8);
  background:#101f35;
  border:1px solid #d8aa31;
  color:#fff;
  padding:15px 22px;
  border-radius:15px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

/* SMALL SCREEN */
@media(max-width:380px){
  .bigCoin{
    width:205px;
    height:205px;
  }

  .timer{
    font-size:34px;
  }

  .total strong{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <div class="brand">
      <div class="logo">SNJ</div>

      <div class="brandText">
        <h1><span>SNJ</span> Mining Bot</h1>
        <p>Mine Today • Build Tomorrow</p>
      </div>
    </div>

    <div class="headerBtns">
      <button class="iconBtn" onclick="telegram()">➤</button>
      <button class="iconBtn">⚙</button>
    </div>

  </header>


  <!-- BALANCE -->
  <section class="balanceCard">

    <div class="balanceTop">

      <div class="balanceTitle">
        <div class="walletIcon">👛</div>

        <div>
          <h2>My SNJ Balance</h2>
          <p>Total Balance</p>
        </div>
      </div>

      <div class="total">
        <div class="miniCoin">SNJ</div>
        <strong id="totalBalance">0.00</strong>
        <small>SNJ</small>
      </div>

    </div>


    <div class="balanceStats">

      <div class="stat">
        <p>⛏ Mining</p>
        <strong id="miningBalance">0.00</strong> SNJ
      </div>

      <div class="stat">
        <p>👛 Wallet</p>
        <strong id="walletBalance">0.00</strong> SNJ
      </div>

      <div class="stat">
        <p>N Token</p>
        <strong id="nBalanceTop">0.00</strong>
      </div>

    </div>

  </section>


  <!-- N TOKEN -->
  <section class="nCard">

    <div class="nLeft">

      <div class="nLogo">N</div>

      <div class="nText">
        <h2>N TOKEN</h2>
        <p>Referral + Tasks Reward</p>
      </div>

    </div>

    <div class="nAmount">
      <span id="nBalance">0.00</span>
      <small>N</small>
    </div>

  </section>


  <!-- MINING -->
  <section class="mining">

    <div id="coin" class="bigCoin" onclick="coinTap()">
      <span>SNJ</span>
    </div>

    <div class="miningTitle">⛏ MINING</div>

    <div id="timer" class="timer">
      04:00:00
    </div>

    <div class="rate">
      Mining Rate • <b>60 SNJ / 4 Hours</b>
    </div>

    <button id="claimBtn" class="claim" onclick="claimSNJ()">
      🪙 CLAIM <span id="claimAmount">0.00</span> SNJ
    </button>

    <button class="ad" onclick="watchAd()">
      🎬 WATCH AD ×2
      <span>2×</span>
    </button>

  </section>

</div>


<!-- NAVIGATION -->
<nav class="nav">

  <button class="active" onclick="navClick(this,'Mine')">
    <div>⛏️</div>
    Mine
  </button>

  <button onclick="navClick(this,'Boost')">
    <div>🚀</div>
    Boost
  </button>

  <button onclick="navClick(this,'Tasks')">
    <div>📋</div>
    Tasks
  </button>

  <button onclick="navClick(this,'Friends')">
    <div>👥</div>
    Friends
  </button>

  <button onclick="navClick(this,'Swap')">
    <div>↕️</div>
    Swap
  </button>

  <button onclick="navClick(this,'Wallet')">
    <div>👛</div>
    Wallet
  </button>

</nav>


<div id="toast" class="toast"></div>


<script>

/* =========================
   TELEGRAM
========================= */

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}


/* =========================
   SETTINGS
========================= */

const MINING_TIME = 4 * 60 * 60 * 1000;
const MAX_REWARD = 60;


/* =========================
   DATA
========================= */

let wallet = Number(localStorage.getItem("snj_wallet") || 0);

let miningStart = Number(
  localStorage.getItem("snj_mining_start") || Date.now()
);

let nToken = Number(
  localStorage.getItem("snj_n_token") || 0
);


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem("snj_wallet",wallet);
  localStorage.setItem("snj_mining_start",miningStart);
  localStorage.setItem("snj_n_token",nToken);

}


/* =========================
   MINING REWARD
========================= */

function getMiningReward(){

  const elapsed = Date.now() - miningStart;

  if(elapsed <= 0) return 0;

  const reward = (elapsed / MINING_TIME) * MAX_REWARD;

  return Math.min(MAX_REWARD,reward);

}


/* =========================
   UPDATE UI
========================= */

function update(){

  const mining = getMiningReward();

  const total = wallet + mining;

  document.getElementById("totalBalance").textContent =
    total.toFixed(2);

  document.getElementById("walletBalance").textContent =
    wallet.toFixed(2);

  document.getElementById("miningBalance").textContent =
    mining.toFixed(2);

  document.getElementById("nBalance").textContent =
    nToken.toFixed(2);

  document.getElementById("nBalanceTop").textContent =
    nToken.toFixed(2);


  const elapsed = Date.now() - miningStart;

  const remaining = Math.max(0,MINING_TIME - elapsed);

  const hours = Math.floor(remaining / 3600000);

  const minutes = Math.floor(
    (remaining % 3600000) / 60000
  );

  const seconds = Math.floor(
    (remaining % 60000) / 1000
  );

  document.getElementById("timer").textContent =
    String(hours).padStart(2,"0") + ":" +
    String(minutes).padStart(2,"0") + ":" +
    String(seconds).padStart(2,"0");


  document.getElementById("claimAmount").textContent =
    mining.toFixed(2);

}


setInterval(update,1000);
update();


/* =========================
   COIN TAP
========================= */

function coinTap(){

  const coin = document.getElementById("coin");

  coin.classList.add("glow");

  setTimeout(()=>{
    coin.classList.remove("glow");
  },250);

}


/* =========================
   CLAIM
========================= */

function claimSNJ(){

  const reward = getMiningReward();

  if(reward <= 0){
    showToast("No SNJ available yet");
    return;
  }


  const button = document.getElementById("claimBtn");

  button.classList.add("shine");


  createFlyingCoins();


  setTimeout(()=>{

    wallet += reward;

    miningStart = Date.now();

    save();

    update();

    button.classList.remove("shine");

    showToast(
      "+" + reward.toFixed(2) + " SNJ Added"
    );

  },850);

}


/* =========================
   FLYING COINS
========================= */

function createFlyingCoins(){

  const start =
    document.getElementById("coin")
    .getBoundingClientRect();

  const target =
    document.querySelector(".miniCoin")
    .getBoundingClientRect();


  for(let i=0;i<8;i++){

    const coin =
      document.createElement("div");

    coin.className="flyCoin";
    coin.textContent="SNJ";

    document.body.appendChild(coin);


    const sx =
      start.left +
      start.width/2 -
      17 +
      (Math.random()*100-50);

    const sy =
      start.top +
      start.height/2 -
      17 +
      (Math.random()*100-50);


    coin.style.left=sx+"px";
    coin.style.top=sy+"px";


    const tx =
      target.left +
      target.width/2 -
      17;

    const ty =
      target.top +
      target.height/2 -
      17;


    setTimeout(()=>{

      coin.animate(

        [
          {
            transform:"translate(0,0) rotate(0deg) scale(1)",
            opacity:1
          },

          {
            transform:
              `translate(${(Math.random()*100-50)}px,
              ${(Math.random()*-120)}px)
              rotate(180deg) scale(.9)`,
            opacity:1
          },

          {
            transform:
              `translate(${tx-sx}px,
              ${ty-sy}px)
              rotate(540deg) scale(.35)`,
            opacity:.2
          }
        ],

        {
          duration:750,
          easing:"cubic-bezier(.2,.7,.3,1)"
        }

      );

    },i*55);


    setTimeout(()=>{
      coin.remove();
    },900);

  }

}


/* =========================
   WATCH AD
========================= */

function watchAd(){

  showToast(
    "Rewarded Ad will be connected later"
  );

}


/* =========================
   NAVIGATION
========================= */

function navClick(button,name){

  document
    .querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  if(name !== "Mine"){
    showToast(name + " section coming soon");
  }

}


/* =========================
   TELEGRAM BUTTON
========================= */

function telegram(){

  if(tg){
    tg.showAlert("Welcome to SNJ Mining Bot");
  }else{
    showToast("Open inside Telegram");
  }

}


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent=message;

  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },1800);

}

</script>

</body>
</html>
