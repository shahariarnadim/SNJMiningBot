<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SNJ Mining Bot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    background:
        radial-gradient(circle at 50% 25%,#263b62 0%,#0a1427 35%,#030814 75%);
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:45%;
    z-index:-1;
    opacity:.35;
    background:
        linear-gradient(90deg,
        transparent 0 3%,
        #101d32 3% 8%,
        transparent 8% 10%,
        #172844 10% 16%,
        transparent 16% 18%,
        #0e1b30 18% 25%,
        transparent 25% 27%,
        #172844 27% 32%,
        transparent 32% 35%,
        #0c1930 35% 43%,
        transparent 43% 45%,
        #172844 45% 51%,
        transparent 51% 54%,
        #0d1b31 54% 62%,
        transparent 62% 64%,
        #172844 64% 71%,
        transparent 71% 74%,
        #0d1b31 74% 82%,
        transparent 82% 84%,
        #172844 84% 91%,
        transparent 91%);
}

.app{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:14px;
    padding-bottom:100px;
}

/* TOP BAR */

.topbar{
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    border:1px solid #c99722;
    border-radius:24px;
    background:linear-gradient(135deg,#071426,#101d31);
    box-shadow:
        0 0 20px #d9a92722,
        inset 0 0 15px #d9a9270d;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:55px;
    height:55px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:19px;
    font-weight:bold;
    color:#17100a;
    background:linear-gradient(145deg,#fff1a3,#d89f19,#fff0a0);
    border:2px solid #f8d96b;
    box-shadow:0 0 18px #f0bd3d66;
}

.brandText b{
    display:block;
    font-size:22px;
}

.brandText b span{
    color:#f2c744;
}

.brandText small{
    color:#f0d26c;
    font-size:11px;
}

.topButtons{
    display:flex;
    gap:9px;
}

.circleBtn{
    width:45px;
    height:45px;
    border-radius:50%;
    border:1px solid #e2b83d;
    background:#101c30;
    color:#ffd75a;
    font-size:21px;
}

/* BALANCE */

.balanceBox{
    margin-top:14px;
    padding:18px;
    border:1px solid #d8a52e;
    border-radius:25px;
    background:linear-gradient(135deg,#071426,#0d1b2f);
    box-shadow:0 0 25px #d8a52e18;
}

.balanceTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.balanceTitle{
    display:flex;
    align-items:center;
    gap:12px;
}

.walletIcon{
    font-size:35px;
}

.balanceTitle small{
    display:block;
    color:#bfc7d5;
    margin-top:4px;
}

.mainBalance{
    display:flex;
    align-items:center;
    gap:7px;
}

.miniCoin{
    width:43px;
    height:43px;
    border-radius:50%;
    display:grid;
    place-items:center;
    color:#15100a;
    font-weight:bold;
    background:linear-gradient(145deg,#fff2a5,#d8a52d,#ffe994);
}

.mainBalance strong{
    font-size:34px;
    color:#ffd653;
}

.mainBalance span{
    color:#f4d75e;
    font-size:18px;
}

.balanceLine{
    height:1px;
    background:#d9ae3a66;
    margin:15px 0;
}

.balanceStats{
    display:flex;
    justify-content:space-around;
    text-align:center;
}

.stat{
    flex:1;
}

.stat:not(:last-child){
    border-right:1px solid #65708755;
}

.stat small{
    display:block;
    color:#b6bfce;
    margin-bottom:5px;
}

.stat b{
    color:#ffd44f;
    font-size:20px;
}

/* HERO */

.hero{
    text-align:center;
    padding:28px 0 20px;
}

.heroCoin{
    width:205px;
    height:205px;
    margin:auto;
    border-radius:50%;
    display:grid;
    place-items:center;
    position:relative;
    background:
        radial-gradient(circle,#ffd951 0 45%,#d79816 46% 58%,#fff0a0 59% 62%,#a96d0c 63% 100%);
    border:8px solid #d7a52d;
    box-shadow:
        0 0 20px #ffd84c88,
        0 0 60px #d9a32e44,
        inset 0 0 30px #fff1a077;
    transition:.2s;
}

.heroCoin:before{
    content:"";
    position:absolute;
    inset:13px;
    border:2px solid #fff0a0;
    border-radius:50%;
}

.heroCoin span{
    position:relative;
    z-index:2;
    font-size:75px;
    font-weight:bold;
    color:#17100a;
    text-shadow:0 2px 2px #fff3a055;
}

.heroCoin:active{
    transform:scale(.94);
    box-shadow:0 0 55px #ffd84caa;
}

.miningTitle{
    margin-top:20px;
    color:#ffd54e;
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
}

.timer{
    margin:12px auto;
    padding:10px;
    border:2px solid #e1b631;
    border-radius:30px;
    max-width:360px;
    background:#071426;
    font-size:32px;
    font-weight:bold;
}

.rate{
    color:#aeb8c8;
    margin-bottom:17px;
}

/* BUTTONS */

.claim{
    width:100%;
    padding:17px;
    border:none;
    border-radius:35px;
    font-size:20px;
    font-weight:bold;
    color:#17100a;
    background:linear-gradient(90deg,#d99e18,#ffe76c,#d99e18);
    box-shadow:0 0 20px #e9bd3b55;
}

.claim:active{
    transform:scale(.98);
}

.ad{
    width:100%;
    margin-top:12px;
    padding:15px;
    border-radius:20px;
    color:white;
    background:linear-gradient(90deg,#071b48,#0d3477,#071b48);
    border:1px solid #168cff;
    box-shadow:0 0 15px #168cff33;
}

.ad b{
    color:#fff;
    font-size:18px;
}

.ad small{
    display:block;
    color:#b9d9ff;
    margin-top:4px;
}

/* BOTTOM NAV */

.nav{
    position:fixed;
    left:50%;
    bottom:8px;
    transform:translateX(-50%);
    width:calc(100% - 20px);
    max-width:500px;
    display:flex;
    gap:5px;
    padding:8px;
    border:1px solid #b98920;
    border-radius:22px;
    background:#071120ee;
    backdrop-filter:blur(10px);
    z-index:20;
}

.nav button{
    flex:1;
    border:0;
    background:transparent;
    color:#b9c1ce;
    padding:8px 2px;
    border-radius:15px;
    font-size:10px;
}

.nav button span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav .active{
    color:#ffd34c;
    background:#c7972117;
}

/* TOAST */

.toast{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%) translateY(-100px);
    padding:13px 20px;
    border-radius:20px;
    background:#15233a;
    border:1px solid #e0b53c;
    color:#ffd957;
    transition:.3s;
    z-index:50;
}

.toast.show{
    transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:380px){
    .mainBalance strong{
        font-size:27px;
    }

    .heroCoin{
        width:175px;
        height:175px;
    }

    .heroCoin span{
        font-size:62px;
    }

    .nav button{
        font-size:8px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- TOP -->

    <div class="topbar">

        <div class="brand">

            <div class="logo">
                SNJ
            </div>

            <div class="brandText">
                <b><span>SNJ</span> Mining Bot</b>
                <small>Mine Today • Build Tomorrow</small>
            </div>

        </div>

        <div class="topButtons">
            <button class="circleBtn" id="telegramBtn">➤</button>
            <button class="circleBtn" id="settingsBtn">⚙</button>
        </div>

    </div>


    <!-- BALANCE -->

    <div class="balanceBox">

        <div class="balanceTop">

            <div class="balanceTitle">

                <div class="walletIcon">👛</div>

                <div>
                    <b>My SNJ Balance</b>
                    <small>Total Balance</small>
                </div>

            </div>

            <div class="mainBalance">

                <div class="miniCoin">SNJ</div>

                <strong id="snjBalance">0.00</strong>

                <span>SNJ</span>

            </div>

        </div>

        <div class="balanceLine"></div>

        <div class="balanceStats">

            <div class="stat">
                <small>⛏ Mining</small>
                <b id="miningBalance">0.00</b>
                <span> SNJ</span>
            </div>

            <div class="stat">
                <small>👛 Wallet</small>
                <b id="walletBalance">0.00</b>
                <span> SNJ</span>
            </div>

            <div class="stat">
                <small>N Token</small>
                <b id="nBalance">0.00</b>
            </div>

        </div>

    </div>


    <!-- MINING -->

    <div class="hero">

        <div class="heroCoin" id="coin">
            <span>S</span>
        </div>

        <div class="miningTitle">
            ⛏ MINING
        </div>

        <div class="timer" id="timer">
            04:00:00
        </div>

        <div class="rate">
            Mining Rate • <b>60 SNJ / 4 Hours</b>
        </div>

        <button class="claim" id="claim">
            🪙 CLAIM <span id="claimAmount">0.00</span> SNJ
        </button>

        <button class="ad" id="ad">

            <b>▶ WATCH AD ×2</b>

            <small>
                Watch rewarded ads and earn more later
            </small>

        </button>

    </div>

</div>


<!-- BOTTOM NAV -->

<div class="nav">

    <button class="active" data-name="Mine">
        <span>⛏</span>
        Mine
    </button>

    <button data-name="Boost">
        <span>🚀</span>
        Boost
    </button>

    <button data-name="Tasks">
        <span>📋</span>
        Tasks
    </button>

    <button data-name="Friends">
        <span>👥</span>
        Friends
    </button>

    <button data-name="Swap">
        <span>↕</span>
        Swap
    </button>

    <button data-name="Wallet">
        <span>👛</span>
        Wallet
    </button>

</div>


<div class="toast" id="toast"></div>


<script>

/* TELEGRAM */

const tg = window.Telegram?.WebApp;

if(tg){

    tg.ready();

    tg.expand();

    try{
        tg.setHeaderColor("#050b18");
        tg.setBackgroundColor("#050b18");
    }catch(e){}

}


/* DATA */

let snj = Number(
    localStorage.getItem("snjBalance") || 0
);

let nToken = Number(
    localStorage.getItem("nToken") || 0
);

let miningStart = Number(
    localStorage.getItem("miningStart") || Date.now()
);

const MINING_TIME = 4 * 60 * 60 * 1000;

const MAX_REWARD = 60;


/* SAVE */

function saveData(){

    localStorage.setItem(
        "snjBalance",
        snj
    );

    localStorage.setItem(
        "nToken",
        nToken
    );

    localStorage.setItem(
        "miningStart",
        miningStart
    );

}


/* UPDATE */

function update(){

    let elapsed =
        Date.now() - miningStart;

    let reward =
        Math.min(
            Math.max(
                0,
                elapsed / MINING_TIME
            ) * MAX_REWARD,
            MAX_REWARD
        );


    document.getElementById(
        "snjBalance"
    ).textContent =
        snj.toFixed(2);


    document.getElementById(
        "walletBalance"
    ).textContent =
        snj.toFixed(2);


    document.getElementById(
        "miningBalance"
    ).textContent =
        reward.toFixed(2);


    document.getElementById(
        "nBalance"
    ).textContent =
        nToken.toFixed(2);


    document.getElementById(
        "claimAmount"
    ).textContent =
        reward.toFixed(2);


    if(reward >= MAX_REWARD){

        document.getElementById(
            "timer"
        ).textContent =
            "READY";

        return;

    }


    let remaining =
        MINING_TIME - elapsed;


    let h =
        Math.floor(
            remaining / 3600000
        );

    let m =
        Math.floor(
            (remaining % 3600000) / 60000
        );

    let s =
        Math.floor(
            (remaining % 60000) / 1000
        );


    document.getElementById(
        "timer"
    ).textContent =

        String(h).padStart(2,"0")
        + ":" +

        String(m).padStart(2,"0")
        + ":" +

        String(s).padStart(2,"0");

}


/* CLAIM */

document.getElementById(
    "claim"
).onclick = function(){

    let elapsed =
        Date.now() - miningStart;


    let reward =
        Math.min(
            Math.max(
                0,
                elapsed / MINING_TIME
            ) * MAX_REWARD,
            MAX_REWARD
        );


    if(reward <= 0){

        showToast(
            "Mining শুরু হয়নি"
        );

        return;

    }


    snj += reward;

    miningStart =
        Date.now();


    saveData();

    update();

    showToast(
        "+" + reward.toFixed(2)
        + " SNJ Claimed!"
    );

};


/* COIN TAP */

document.getElementById(
    "coin"
).onclick = function(){

    this.style.transform =
        "scale(.94)";

    setTimeout(()=>{
        this.style.transform =
            "";
    },150);

};


/* AD */

document.getElementById(
    "ad"
).onclick = function(){

    showToast(
        "Real rewarded ads will be connected later."
    );

};


/* TOP BUTTONS */

document.getElementById(
    "telegramBtn"
).onclick = function(){

    if(tg){

        tg.openTelegramLink(
            "https://t.me/SNJMiningbot"
        );

    }

};


document.getElementById(
    "settingsBtn"
).onclick = function(){

    showToast(
        "Settings coming soon"
    );

};


/* NAV */

document.querySelectorAll(
    ".nav button"
).forEach(button=>{

    button.onclick = function(){

        document.querySelectorAll(
            ".nav button"
        ).forEach(b=>{
            b.classList.remove("active");
        });

        this.classList.add("active");

        let name =
            this.dataset.name;

        if(name !== "Mine"){

            showToast(
                name + " section coming soon"
            );

        }

    };

});


/* TOAST */

function showToast(message){

    let toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },2500);

}


/* START */

saveData();

update();

setInterval(
    update,
    1000
);

</script>

</body>
</html>
