<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">

<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#020817"/>
    <stop offset="55%" stop-color="#071a35"/>
    <stop offset="100%" stop-color="#020711"/>
  </linearGradient>

  <!-- Gold glow -->
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#ffd84a" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#ffd84a" stop-opacity="0"/>
  </radialGradient>

  <!-- Water -->
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#092b4b"/>
    <stop offset="100%" stop-color="#010713"/>
  </linearGradient>

  <!-- Building -->
  <linearGradient id="building" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#071a31"/>
    <stop offset="50%" stop-color="#102b49"/>
    <stop offset="100%" stop-color="#020914"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="25"/>
  </filter>

  <filter id="goldGlow">
    <feGaussianBlur stdDeviation="8"/>
  </filter>

</defs>


<!-- MAIN SKY -->
<rect width="1080" height="1920" fill="url(#bg)"/>


<!-- GOLD ATMOSPHERE -->
