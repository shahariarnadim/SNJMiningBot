<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNJ Mining</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#050b18;
    color:#fff;
    min-height:100vh;
}

.app{
    max-width:480px;
    margin:auto;
    min-height:100vh;
    padding-bottom:85px;
    background:
      radial-gradient(circle at 50% 20%,#172642 0%,#07101f 40%,#030712 100%);
}

/* HEADER */

.header{
    padding:18px 18px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo-title{
    font-size:23px;
    font-weight:800;
    color:#ffd86b;
    letter-spacing:1px;
}

.header-right{
    width:40px;
    height:40px;
    border:1px solid #c99b35;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* COIN */

.coin-area{
    text-align:center;
    padding:15px 0 10px;
}

.coin{
    width:155px;
    height:155px;
    margin:auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
      radial-gradient(circle at 35% 30%,
      #fff1a3 0%,
      #ffd34e 22%,
      #d99b17 55%,
      #80520b 100%);

    border:7px solid #f3c64d;

    box-shadow:
      0 0 25px rgba(255,193,55,.35),
      inset 0 0 20px rgba(255,255,255,.3);
}

.coin span{
    font-size:55px;
    font-weight:900;
    color:#17110a;
    text-shadow:0 2px 2px rgba(255,255,255,.4);
}

.premium{
    margin-top:10px;
    font-size:12px;
    color:#d9b45b;
    letter-spacing:2px;
}

/* BALANCE */

.balance-card{
    margin:15px;
    padding:18px;
    border-radius:18px;

    background:linear-gradient(
      145deg,
      rgba(20,34,57,.95),
      rgba(7,15,29,.98)
    );

    border:1px solid rgba(220,171,61,.35);
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.balance-title{
    color:#9ca9bd;
    font-size:13px;
}

.balance{
    margin-top:5px;
    font-size:32px;
    font-weight:800;
    color:#ffd35a;
}

.balance span{
    font-size:15px;
    color:#d7b45a;
}

/* THREE BALANCES */

.balances{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin:15px;
}

.small-card{
    padding:13px 7px;
    text-align:center;
    background:#0b1729;
    border:1px solid #243754;
    border-radius:14px;
}

.small-card h4{
    font-size:11px;
    color:#8291a8;
}

.small-card p{
    margin-top:7px;
    font-size:16px;
    font-weight:bold;
    color:#f5c94c;
}

/* N TOKEN */

.n-token{
    margin:15px;
    padding:16px;

    background:
      linear-gradient(135deg,
      rgba(35,42,62,.95),
      rgba(12,20,34,.95));

    border:1px solid rgba(255,204,83,.45);
    border-radius:16px;
}

.n-header{
    display:flex;
    justify-content:space-between;
}

.n-header strong{
    color:#ffd45a;
}

.n-token p{
    margin-top:10px;
    color:#9daabd;
    font-size:12px;
}

/* MINING */

.mining-card{
    margin:15px;
    padding:18px;
    border-radius:20px;

    background:#091526;
    border:1px solid #263b58;
}

.mining-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.mining-title h3{
    color:#fff;
}

.status{
    color:#61d98a;
    font-size:12px;
}

.timer{
    text-align:center;
    font-size:38px;
    font-weight:800;
    margin:20px 0;
    color:#ffd45a;
}

.rate{
    text-align:center;
    color:#9ba9bc;
    font-size:13px;
}

.progress{
    height:8px;
    background:#18283d;
    border-radius:10px;
    margin:18px 0;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#b87912,#ffe08a);
    transition:.4s;
}

/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    border:none;
    padding:14px;
    border-radius:13px;
    font-weight:bold;
    cursor:pointer;
}

.claim{
    background:linear-gradient(135deg,#ffd85d,#bd7b0d);
    color:#17110a;
}

.ad{
    background:#14243a;
    border:1px solid #b68a2b;
    color:#ffd45a;
}

/* MENU */

.bottom-menu{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    height:76px;

    background:rgba(5,12,24,.97);
    border-top:1px solid #243650;

    display:grid;
    grid-template-columns:repeat(6,1fr);
    z-index:100;
}

.menu-item{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#78879b;
    font-size:10px;
    gap:5px;
}

.menu-item.active{
    color:#ffd258;
}

.menu-icon{
    font-size:20px;
}

/* CLAIM ANIMATION */

.fly-coin{
    position:fixed;
    font-size:28px;
    pointer-events:none;
    z-index:999;
    animation:fly 1s ease-in forwards;
}

@keyframes fly{
    0%{
        transform:translate(0,0) scale(1);
        opacity:1;
    }

    100%{
        transform:translate(
          var(--x),
          var(--y)
        ) scale(.2);
        opacity:0;
    }
}

.notification{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:#17263c;
    border:1px solid #d1a53c;
    color:#ffd968;
    padding:13px 18px;
    border-radius:12px;
    z-index:1000;
    display:none;
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">
        <div class="logo-title">SNJ MINING</div>

        <div class="header-right">
            🔔
        </div>
    </div>

    <!-- GOLD COIN -->
    <div class="coin-area">
        <div class="coin">
            <span>SNJ</span>
        </div>

        <div class="premium">
            PREMIUM GOLD MINING
        </div>
    </div>

    <!-- MAIN BALANCE -->
    <div class="balance-card">
        <div class="balance-title">
            My SNJ Balance
        </div>

        <div class="balance">
            <span id="mainBalance">0.0000</span>
            <span>SNJ</span>
        </div>
    </div>

    <!-- 3 BALANCES -->
    <div class="balances">

        <div class="small-card">
            <h4>MINING</h4>
            <p id="miningBalance">0.0000</p>
        </div>

        <div class="small-card">
            <h4>WALLET</h4>
            <p id="walletBalance">0.0000</p>
        </div>

        <div class="small-card">
            <h4>N TOKEN</h4>
            <p id="nBalance">0</p>
        </div>

    </div>

    <!-- N TOKEN -->
    <div class="n-token">

        <div class="n-header">
            <strong>N Token</strong>
            <strong id="nTokenValue">0 N</strong>
        </div>

        <p>
            Referral Reward + Tasks Reward
        </p>

    </div>

    <!-- MINING -->
    <div class="mining-card">

        <div class="mining-title">
            <h3>⚡ Mining</h3>

            <div class="status" id="status">
                ● MINING
            </div>
        </div>

        <div class="timer" id="timer">
            04:00:00
        </div>

        <div class="rate">
            Mining Rate:
            <b>0.0100 SNJ / hour</b>
        </div>

        <div class="progress">
            <div
                class="progress-bar"
                id="progressBar">
            </div>
        </div>

        <div class="buttons">

            <button
                class="claim"
                onclick="claimMining()">
                💰 CLAIM
            </button>

            <button
                class="ad"
                onclick="watchAd()">
                ▶ Watch Ad 2×
            </button>

        </div>

    </div>

</div>


<!-- BOTTOM MENU -->

<div class="bottom-menu">

    <div class="menu-item active">
        <div class="menu-icon">⛏️</div>
        Mine
    </div>

    <div class="menu-item">
        <div class="menu-icon">🚀</div>
        Boost
    </div>

    <div class="menu-item">
        <div class="menu-icon">🎯</div>
        Tasks
    </div>

    <div class="menu-item">
        <div class="menu-icon">👥</div>
        Friends
    </div>

    <div class="menu-item">
        <div class="menu-icon">🔄</div>
        Swap
    </div>

    <div class="menu-item">
        <div class="menu-icon">💼</div>
        Wallet
    </div>

</div>

<div
    class="notification"
    id="notification">
    ⏰ Mining finished — Claim your SNJ!
</div>


<script>

/* ==========================
   SNJ MINING SETTINGS
========================== */

const MINING_TIME = 4 * 60 * 60;

const MINING_RATE = 0.0100;


/* ==========================
   VARIABLES
========================== */

let remaining = MINING_TIME;

let miningBalance = 0;

let walletBalance = 0;

let nBalance = 0;

let miningFinished = false;


/* ==========================
   TIMER
========================== */

function updateTimer(){

    if(remaining <= 0){

        remaining = 0;

        miningFinished = true;

        document.getElementById("status")
            .innerText = "● CLAIM REQUIRED";

        document.getElementById("status")
            .style.color = "#ff6767";

        document.getElementById("notification")
            .style.display = "block";

        return;
    }

    let hours =
        Math.floor(remaining / 3600);

    let minutes =
        Math.floor((remaining % 3600) / 60);

    let seconds =
        remaining % 60;

    document.getElementById("timer")
        .innerText =
        String(hours).padStart(2,"0")
        + ":" +
        String(minutes).padStart(2,"0")
        + ":" +
        String(seconds).padStart(2,"0");

    let progress =
        ((MINING_TIME - remaining)
        / MINING_TIME) * 100;

    document.getElementById("progressBar")
        .style.width = progress + "%";

    remaining--;

}


setInterval(updateTimer,1000);


/* ==========================
   CLAIM
========================== */

function claimMining(){

    if(!miningFinished){

        showMessage(
            "⏳ ৪ ঘণ্টা শেষ হলে Claim করতে পারবে"
        );

        return;
    }

    const earned = MINING_RATE * 4;

    miningBalance += earned;

    walletBalance += earned;

    updateBalances();

    createFlyingCoins();

    miningFinished = false;

    remaining = MINING_TIME;

    document.getElementById("status")
        .innerText = "● MINING";

    document.getElementById("status")
        .style.color = "#61d98a";

    document.getElementById("notification")
        .style.display = "none";

}


/* ==========================
   WATCH AD 2X
========================== */

function watchAd(){

    if(miningFinished){

        showMessage(
            "আগে Claim করুন"
        );

        return;
    }

    miningBalance += 0.0200;

    updateBalances();

    showMessage(
        "🎁 Ad Reward: +0.0200 SNJ"
    );

}


/* ==========================
   BALANCE UPDATE
========================== */

function updateBalances(){

    document.getElementById("mainBalance")
        .innerText =
        (miningBalance + walletBalance)
